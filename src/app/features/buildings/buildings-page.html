<app-card class="p-6">
  <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 border-b border-stone-800 pb-4">
    <div>
      <h2 class="font-semibold text-stone-200 text-lg flex items-center">
        <i class="fa-solid fa-building text-red-400 mr-2.5"></i> Guide des Bâtiments
      </h2>
      <p class="text-xs text-stone-400 mt-1">Données officielles tirées des grilles de coûts, temps et habitants.</p>
    </div>
    <app-segmented-control [options]="options" [(value)]="selectedId" />
  </div>

  @let g = guide();
  <div class="mt-6">
    <div class="flex justify-between items-center mb-3">
      <h3 class="text-sm font-bold text-red-300 flex items-center">
        <i class="fa-solid {{ g.icon }} mr-2"></i> {{ g.label }}
      </h3>
      <span class="text-xs text-stone-400">Coûts pour passer au niveau suivant</span>
    </div>
    <app-data-table [columns]="g.columns" [rows]="g.rows" />
  </div>
</app-card>
